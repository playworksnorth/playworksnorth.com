<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 508 254">
  <!-- It Shall Pass card: the game's own mark on its own night field.
       Colours are GamePalette entries, not the studio teal: night blue
       #101428 and #0A0A14 (COOL), cyan #84E2E8 (COOL neon ramp), and
       amber #F0A860 (brightest WARM ember step, the one living light). -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101428"/>
      <stop offset="1" stop-color="#0A0A14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#84E2E8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#84E2E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0A860" stop-opacity=".30"/>
      <stop offset="1" stop-color="#F0A860" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="508" height="254" fill="url(#night)"/>
  <ellipse cx="254" cy="120" rx="190" ry="110" fill="url(#glow)"/>
  <g transform="translate(166.2,37.2) scale(1.46)">
    <g fill="#84E2E8">
      <path d="M 6,28 Q 60,38 114,28 L 114,17 Q 60,27 6,17 Z"/>
      <rect x="22" y="40" width="76" height="7"/>
      <rect x="34" y="30" width="11" height="76"/>
      <rect x="75" y="30" width="11" height="76"/>
    </g>
  </g>
  <!-- the ember, with its own small halo: the only warm light in a cool city -->
  <ellipse cx="254" cy="151" rx="46" ry="46" fill="url(#ember)"/>
  <circle cx="254" cy="151" r="10.2" fill="#F0A860"/>
</svg>
