name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 74.208.9.220 >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh root@74.208.9.220 '
            cd /root/playworksnorth.com &&
            git pull &&
            venv/bin/pip install -r requirements.txt -q &&
            venv/bin/python playworksnorth/manage.py compilemessages -l fr &&
            venv/bin/python playworksnorth/manage.py collectstatic --no-input &&
            systemctl restart playworksnorth.service
          '
